# raki.yaml — SODA pipeline evaluation manifest
#
# Raki evaluates completed SODA pipeline sessions for quality metrics:
# first-pass success rate, rework cycles, cost efficiency, and more.
#
# Install:
#   uv tool install raki
#
# Run (operational metrics, no API key needed):
#   raki run -m raki.yaml
#
# Run with knowledge + retrieval quality metrics (requires Vertex/Anthropic):
#   raki run -m raki.yaml --docs-path . --judge --judge-provider vertex-anthropic
#
# Validate this manifest:
#   raki validate -m raki.yaml
#
# Sessions are read from .soda/ (gitignored). You need at least one completed
# pipeline run before raki has anything to evaluate.

sessions:
  path: .soda

# metrics: per-model parse quality tracking for model routing decisions.
# These metrics are derived from PhaseState fields (ModelUsed,
# ParseAttempts, ParseSuccessOnFirst) persisted in meta.json.
metrics:
  - name: model_parse_success_rate
    description: "Fraction of phases where the output parsed on the first attempt, grouped by model"
    type: gauge
    labels:
      - model_used
  - name: model_parse_failure_count
    description: "Total parse retry attempts across all phases, grouped by model"
    type: counter
    labels:
      - model_used
